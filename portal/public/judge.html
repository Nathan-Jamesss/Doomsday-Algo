<!-- portal/public/judge.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Judge Queue — Doomsday Algorithm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/theme.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="shared/firebaseConfig.js"></script>
  <script src="shared/toast.js"></script>
</head>
<body>
  <script src="shared/banner.js"></script>
  <main style="max-width:720px;margin:2rem auto;padding:0 1.5rem;">
    <div id="judge-id-prompt" class="win win--warn">
      <header class="win__bar">
        <span class="win__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="win__title">EARTH-4471 // JUDGE ACCESS</span>
      </header>
      <div class="win__body">
        <label>Judge ID</label>
        <input id="judge-id-input" type="text">
        <p style="margin:var(--s-3) 0 0;color:var(--text-quiet);">Reports are shown blind. Team names are hidden.</p>
        <button id="judge-id-save" style="margin-top:var(--s-3);">Start</button>
      </div>
    </div>
    <div id="report-view" style="display:none;"></div>
  </main>
  <script src="judge.js"></script>
</body>
</html>
