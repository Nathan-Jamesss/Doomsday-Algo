<!-- portal/public/predict.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Predict — Doomsday Algorithm</title>
  <link rel="stylesheet" href="shared/theme.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="shared/firebaseConfig.js"></script>
</head>
<body>
  <script src="shared/banner.js"></script>
  <script src="shared/nav.js"></script>
  <script>
    renderBanner();
    renderNav('predict');
  </script>
  <main style="max-width:900px;margin:2rem auto;padding:0 1.5rem;">
    <h1 class="accent-green">Round 2 — Predict</h1>
    <div id="team-id-prompt" class="panel">
      <label>Team ID: <input id="team-id-input" type="text"></label>
      <button id="team-id-save">Continue</button>
    </div>
    <div id="questions" style="display:none;"></div>
    <!-- No live per-team score here by design: a raw predictRaw value,
         readable the instant a submission is graded, lets a throwaway team
         probe one question at a time (submit 100%, read the score back)
         and extract the whole answer key during Round 2 itself (caught in
         final review). Combined standings live on the projector
         (admin.html), which only ever shows rank + blended total. -->
    <p style="opacity:0.7;">Check the projector for live standings.</p>
  </main>
  <script src="predict.js"></script>
</body>
</html>
