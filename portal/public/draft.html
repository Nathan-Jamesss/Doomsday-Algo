<!-- portal/public/draft.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft — Doomsday Algorithm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/theme.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="shared/firebaseConfig.js"></script>
  <script src="shared/toast.js"></script>
  <style>
    #board { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--s-4); margin-top: var(--s-4); }
  </style>
</head>
<body>
  <script src="shared/banner.js"></script>
  <script src="shared/nav.js"></script>
  <main style="max-width:1240px;margin:2rem auto;padding:0 1.5rem;">
    <section class="win win--accent">
      <header class="win__bar">
        <span class="win__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="win__title">EARTH-4471 // DRAFT BOARD</span>
      </header>
      <div class="win__body">
        <h1 style="margin-bottom:var(--s-3);">Round 3 — Draft</h1>
        <!-- Drop-in event, no shared clock: come whenever, draft whenever.
             Each character is exclusive and gone the moment someone else
             takes it, so the pool thins out over the course of the event --
             drafting earlier means more choice, not a synchronized turn. -->
        <p style="margin:0;">Pick 1 character. Once picked by anyone, it's gone — no rush, but the pool shrinks as the event goes on.</p>
      </div>
    </section>
    <div id="board"></div>
  </main>
  <script src="draft.js"></script>
</body>
</html>
